name: CI

on:
  push:
    branches: [main, chore/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutri_tracker
          POSTGRES_USER: nutri
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutri -d nutri_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://nutri:ci_password@localhost:5432/nutri_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate Docker Compose configuration
        working-directory: .
        run: docker compose -f infra/docker-compose.yml config
      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head
      - name: Check PostgreSQL schema
        run: >-
          python -c "import os; from sqlalchemy import create_engine, text;
          print(create_engine(os.environ['DATABASE_URL']).connect().execute(text('select count(*) from information_schema.tables')).scalar_one())"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
